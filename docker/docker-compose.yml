name: workshopcode

services:
  db:
    image: postgres:16
    ports:
      - "127.0.0.1:${POSTGRES_PORT_EXT}:${POSTGRES_PORT_INT}"
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB: ${APP_DB}
      APP_USER: ${APP_USER}
      APP_PASSWORD: ${APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      start_period: 60s
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [ internal ]

  api:
    build:
      context: ..
      dockerfile: docker/Api.Dockerfile
      args:
        API_PORT_INT: ${HTTP_PORT_INT}
    env_file:
      - .env
    volumes:
      - ./dpkeys:/keys
      - ${EXERCISE_CHAT_ATTACHMENTS_PATH}:/app/wwwroot/chatsExercise-attachments        
    environment:
      # перекрывает appsettings.Development.json:
      ConnectionStrings__Default: "Host=db;Port=${POSTGRES_PORT_INT};Database=${POSTGRES_DB};Username=${APP_USER};Password=${APP_PASSWORD};Pooling=true"
      Mongo__ConnectionString: "mongodb://${MONGO_USER}:${MONGO_PASSWORD}@${MONGO_CONTAINER}:${MONGO_PORT_INT}/?authSource=admin"
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_DataProtection__ApplicationName: WorkshopCode.Dev
      DataProtection__Path: /keys
      ASPNETCORE_HTTP_PORTS: "${HTTP_PORT_INT}"
      Seeding__RunOnStartup: ${Seeding_RunOnStartup:-false}
      Auth__RequireConfirmedEmail: ${Auth_RequireConfirmedEmail:-true}
      SuperAdmin__Password: ${SuperAdmin_Password:-}
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT_EXT}:${HTTP_PORT_INT}"
    healthcheck:
      start_period: 30s
      test: [ "CMD-SHELL", "curl -fsS http://localhost:${HTTP_PORT_INT}/health || exit 1" ]
      interval: 30s
      timeout: 3s
      retries: 5
    networks: [ internal ]

  mongo:
    image: mongo:7.0.29
    container_name: ${MONGO_CONTAINER}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONGO_PORT_EXT}:${MONGO_PORT_INT}"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      start_period: 20s
      test: [ "CMD-SHELL", "mongosh --quiet --username $${MONGO_USER} --password $${MONGO_PASSWORD} --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1 >/dev/null || exit 1" ]
      interval: 60s
      timeout: 5s
      retries: 5
    networks: [ internal ]

networks:
  internal:


volumes:
  pgdata:
  mongo_data:
